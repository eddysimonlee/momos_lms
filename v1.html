<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#152d40">
<title>모모스 온보딩</title>
<link rel="icon" href="/icons/momos-erp.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/wds/web/variables.css">
<style>
/* v1 — service CSS. Tokens come from WDS 0.4.0 (vendored at /wds/web/variables.css, never edited).
   vendor: https://pages.navercorp.com/saas-product-design/wds/0.4.0/web/variables.css
   Rule of thumb: component token → semantic token → spacing/radius primitive. No literals. */
@font-face{font-family:Pretendard;font-style:normal;font-weight:45 920;font-display:swap;src:url('/assets/PretendardVariable.woff2') format('woff2')}
.auth-pending #appShell{display:none}
#appShell{min-height:100svh;background:var(--surface-default);color:var(--text-default);font:var(--body-lg);font-family:var(--font-family),-apple-system,BlinkMacSystemFont,sans-serif}
#appShell *{box-sizing:border-box;font-family:inherit}
/* top bar = gnb type default */
.v1-top{position:sticky;top:0;z-index:var(--component-layout-z-index-gnb);display:flex;align-items:center;gap:var(--spacing-8);height:var(--component-gnb-height);padding:0 var(--spacing-16);background:var(--component-gnb-type-default-surface);color:var(--component-gnb-type-default-label-color);box-shadow:var(--shadow-sm)}
.v1-top .v1-back{appearance:none;border:0;background:transparent;color:var(--icon-default);font:var(--title-md);padding:0 var(--spacing-8) 0 0;cursor:pointer}
.v1-top .v1-back[hidden]{display:none}
.v1-top h1{flex:1;margin:0;font:var(--title-xs-bold);color:var(--text-default);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* account button = tag outline xs pill */
.v1-top .v1-who{appearance:none;height:var(--component-tag-size-xs-height);padding:0 var(--component-tag-size-xs-padding-x);border:var(--component-tag-color-outline-border-width) solid var(--component-tag-color-outline-border-color);background:var(--component-tag-color-outline-surface);color:var(--component-tag-color-outline-text-color);border-radius:var(--component-tag-type-pill-border-radius);font:var(--label-sm);cursor:pointer;max-width:44vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* dev switcher = banner yellow, round */
.v1-dev{display:flex;gap:var(--spacing-8);align-items:center;flex-wrap:wrap;min-height:var(--component-banner-base-height);padding:var(--component-banner-base-padding-y) var(--component-banner-type-round-padding-x);background:var(--component-banner-color-yellow-surface);color:var(--component-banner-color-yellow-text);font:var(--component-banner-base-typography)}
.v1-dev[hidden]{display:none}
.v1-dev button{appearance:none;height:var(--component-tag-size-xs-height);padding:0 var(--component-tag-size-xs-padding-x);border:var(--component-tag-color-outline-border-width) solid var(--component-tag-color-outline-border-color);background:var(--component-tag-color-outline-surface);color:var(--component-tag-color-outline-text-color);border-radius:var(--component-tag-type-pill-border-radius);font:var(--label-sm);cursor:pointer}
.v1-dev button.on{background:var(--component-tag-color-solid-surface);border-color:var(--component-tag-color-solid-surface);color:var(--component-tag-color-solid-text-color)}
.v1-main{max-width:600px; /* wds-allow: 읽기 폭 상한, 레이아웃 토큰 없음 */margin:0 auto;padding:var(--spacing-16) var(--spacing-16) var(--spacing-48)}
.v1-card{background:var(--surface-subtle);border:1px solid var(--border-subtle);border-radius:var(--radius-xl);padding:var(--spacing-16);margin-bottom:var(--spacing-12)}
.v1-card h2{margin:0 0 var(--spacing-4);font:var(--title-xs-bold)}
.v1-muted{color:var(--text-muted);font:var(--body-sm)}
/* notes = banner round: gray / yellow / blue */
.v1-note{display:block;min-height:var(--component-banner-base-height);padding:var(--component-banner-base-padding-y) var(--component-banner-type-round-padding-x);border-radius:var(--component-banner-type-round-radius);background:var(--component-banner-color-gray-surface);color:var(--component-banner-color-gray-text);font:var(--component-banner-base-typography);margin:var(--spacing-12) 0 0}
.v1-note.warn{background:var(--component-banner-color-yellow-surface);color:var(--component-banner-color-yellow-text)}
.v1-note.ok{background:var(--component-banner-color-blue-surface);color:var(--component-banner-color-blue-text)}
.v1-progress{height:var(--spacing-8);border-radius:var(--radius-full);background:var(--surface-muted);overflow:hidden;margin:var(--spacing-12) 0 var(--spacing-4)}
.v1-progress i{display:block;height:100%;background:var(--surface-primary);border-radius:var(--radius-full)}
.v1-list{display:flex;flex-direction:column;gap:var(--spacing-8);margin:var(--spacing-16) 0 0;padding:0;list-style:none}
.v1-item{appearance:none;width:100%;text-align:left;background:var(--surface-default);border:1px solid var(--border-default);border-radius:var(--radius-xl);padding:var(--spacing-12) var(--spacing-16);display:flex;gap:var(--spacing-12);align-items:center;cursor:pointer;font:inherit;color:var(--text-default)}
.v1-item:hover{background:var(--action-hover)}
.v1-item:active{background:var(--surface-fill-pressed)}
.v1-item .v1-num{flex:none;width:var(--spacing-28);height:var(--spacing-28);border-radius:var(--radius-full);display:grid;place-items:center;font:var(--label-sm-bold);background:var(--component-tag-color-neutral-surface);color:var(--component-tag-color-neutral-text-color)}
.v1-item.practice .v1-num{background:var(--component-tag-color-info-surface);color:var(--component-tag-color-info-text-color)}
.v1-item.review .v1-num{background:var(--component-tag-color-warning-surface);color:var(--component-tag-color-warning-text-color)}
.v1-item.done .v1-num{background:var(--surface-success-vivid);color:var(--text-static-light)}
.v1-item .v1-body{flex:1;min-width:0}
.v1-item .v1-body strong{display:block;font:var(--body-md-bold)}
.v1-item .v1-body small{color:var(--text-muted);font:var(--label-sm)}
.v1-item .v1-chev{color:var(--icon-subtle);font:var(--body-xl)}
/* status pill = tag xxs pill */
.v1-pill{display:inline-flex;align-items:center;height:var(--component-tag-size-xxs-height);padding:0 var(--component-tag-size-xxs-padding-x);border-radius:var(--component-tag-type-pill-border-radius);font:var(--label-xs-bold);background:var(--component-tag-color-neutral-surface);color:var(--component-tag-color-neutral-text-color);vertical-align:middle}
.v1-pill.practice{background:var(--component-tag-color-info-surface);color:var(--component-tag-color-info-text-color)}
.v1-pill.review{background:var(--component-tag-color-warning-surface);color:var(--component-tag-color-warning-text-color)}
.v1-pill.done{background:var(--component-tag-color-success-surface);color:var(--component-tag-color-success-text-color)}
.v1-copy p{margin:0 0 var(--spacing-8);font:var(--body-lg)}
.v1-photo{margin:var(--spacing-12) 0 0}.v1-photo img{width:100%;border-radius:var(--radius-lg);display:block}.v1-photo figcaption{color:var(--text-muted);font:var(--label-sm);margin-top:var(--spacing-4)}
.v1-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--spacing-12);margin:var(--spacing-12) 0 0}.v1-photos .v1-photo{margin:0;min-width:0}.v1-photos .v1-photo img{height:160px;object-fit:contain;background:var(--surface-secondary)}
/* checks = checkbox item (16px control + md label); the whole row is the tap target */
.v1-checks{list-style:none;margin:var(--spacing-8) 0 0;padding:0;display:flex;flex-direction:column;gap:var(--spacing-8)}
.v1-checks label{position:relative;display:flex;gap:var(--spacing-12);align-items:flex-start;padding:var(--spacing-12) var(--spacing-16);border:1px solid var(--border-default);border-radius:var(--radius-lg);background:var(--surface-default);cursor:pointer;font:var(--component-checkbox-label-md-typography);color:var(--component-checkbox-state-default-label-text)}
.v1-checks label:has(input:checked){background:var(--action-selected);border-color:var(--border-primary)}
.v1-checks label:has(input:disabled){cursor:default;color:var(--component-checkbox-state-disabled-label-text)}
.v1-checks input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.v1-checks .v1-box{flex:none;width:var(--component-checkbox-size);height:var(--component-checkbox-size);margin-top:2px;border-radius:var(--component-checkbox-radius);border:var(--component-checkbox-border-width) solid var(--component-checkbox-state-default-border);background:var(--component-checkbox-state-default-background);display:grid;place-items:center}
.v1-checks label:hover .v1-box{border-color:var(--component-checkbox-state-hover-border)}
.v1-checks input:checked+.v1-box{background:var(--component-checkbox-state-selected-background);border-color:var(--component-checkbox-state-selected-background)}
.v1-checks input:checked+.v1-box::after{content:'';width:5px;height:9px;border:solid var(--component-checkbox-state-selected-icon-color);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)} /* wds-allow: 체크 표시 도형, 아이콘 자산은 2차에 mono/16/check.svg로 교체 */
.v1-checks input:disabled+.v1-box{border-color:var(--component-checkbox-state-disabled-border)}
.v1-checks input:checked:disabled+.v1-box{background:var(--component-checkbox-state-selected-disabled-background);border-color:var(--component-checkbox-state-selected-disabled-background)}
.v1-checks input:focus-visible+.v1-box{box-shadow:var(--component-checkbox-state-selected-focus-focus-ring)}
.v1-checks .v1-by{display:block;color:var(--text-muted);font:var(--label-sm);margin-top:2px}
/* memo = input square md, multiline */
.v1-memo{width:100%;min-height:var(--spacing-72);border:1px solid var(--component-input-type-square-state-default-border);border-radius:var(--component-input-type-square-size-md-radius);padding:var(--spacing-8) var(--component-input-type-square-size-md-padding-x);font:var(--component-input-type-square-size-md-typography);color:var(--text-default);resize:vertical;background:var(--component-input-type-square-state-default-background)}
.v1-memo:disabled{background:var(--surface-subtle);color:var(--text-default-disabled)}
/* actions = button lg, primary / secondary */
.v1-actions{position:sticky;bottom:0;background:var(--surface-default);padding:var(--spacing-12) 0 calc(var(--spacing-8) + env(safe-area-inset-bottom));display:flex;gap:var(--spacing-8)}
.v1-btn{appearance:none;flex:1;height:var(--component-button-size-lg-height);padding:0 var(--component-button-size-lg-padding-x);border-radius:var(--component-button-size-lg-radius);border:1px solid var(--component-button-type-secondary-state-default-border);background:var(--component-button-type-secondary-state-default-background);color:var(--component-button-type-secondary-state-default-text);font:var(--component-button-type-primary-typography);cursor:pointer}
.v1-btn:hover{background:var(--component-button-type-secondary-state-hover-background)}
.v1-btn:disabled{border-color:var(--component-button-type-secondary-state-disabled-border);color:var(--component-button-type-secondary-state-disabled-text);cursor:default}
.v1-btn.primary{background:var(--component-button-type-primary-state-default-background);border-color:transparent;color:var(--component-button-type-primary-state-default-text)}
.v1-btn.primary:hover{background:var(--component-button-type-primary-state-hover-background)}
.v1-btn.primary:disabled{background:var(--component-button-type-primary-state-disabled-background);color:var(--component-button-type-primary-state-disabled-text)}
/* guide = collapsible card */
.v1-guide{margin-top:var(--spacing-12)}
.v1-guide summary{cursor:pointer;font:var(--body-md-bold);padding:var(--spacing-12) var(--spacing-16);border:1px solid var(--border-default);border-radius:var(--radius-lg);background:var(--surface-default);list-style:none;display:flex;justify-content:space-between;align-items:center}
.v1-guide summary::-webkit-details-marker{display:none}
.v1-guide summary::after{content:'펼치기';font:var(--label-sm);color:var(--text-muted)}
.v1-guide[open] summary{border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.v1-guide[open] summary::after{content:'접기'}
.v1-guide .v1-guide-body{padding:var(--spacing-4) var(--spacing-16) var(--spacing-16);background:var(--surface-default);border:1px solid var(--border-default);border-top:0;border-radius:0 0 var(--radius-lg) var(--radius-lg);font:var(--body-md)}
.v1-guide-body h1{font:var(--title-xs-bold);margin:var(--spacing-16) 0 var(--spacing-8)}.v1-guide-body h2{font:var(--body-lg-bold);margin:var(--spacing-16) 0 var(--spacing-4)}.v1-guide-body h3{font:var(--body-md-bold);color:var(--text-primary);margin:var(--spacing-12) 0 var(--spacing-4)}
.v1-guide-body p{margin:0 0 var(--spacing-8)}.v1-guide-body .table-wrap{overflow-x:auto;margin:var(--spacing-8) 0}
.v1-guide-body table{border-collapse:collapse;width:100%;font:var(--body-sm)}.v1-guide-body th,.v1-guide-body td{border:1px solid var(--border-default);padding:var(--spacing-6) var(--spacing-8);text-align:left;vertical-align:top}.v1-guide-body th{background:var(--surface-subtle)}
.v1-guide-body td p,.v1-guide-body th p{margin:0}
.v1-src{color:var(--text-muted);font:var(--label-xs);margin:var(--spacing-12) 0 0}
.v1-stage{margin:var(--spacing-24) 0 0;font:var(--title-sm-bold)}
.v1-stages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--spacing-8);margin:var(--spacing-16) 0 0}
.v1-stages button{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:var(--spacing-8);text-align:left;padding:var(--spacing-10) var(--spacing-12);border:1px solid var(--border-default);border-radius:var(--radius-lg);background:var(--surface-default);color:inherit;cursor:pointer;min-width:0}
.v1-stages button b{grid-row:span 2;font:var(--title-xs-bold);color:var(--text-muted)}
.v1-stages button span{font:var(--label-sm-bold);min-width:0;word-break:keep-all}
.v1-stages button small{color:var(--text-muted);font:var(--label-xs)}
.v1-stages button.on{border-color:var(--border-primary);box-shadow:inset 0 0 0 1px var(--border-primary)}
.v1-stages button.on b{color:var(--component-button-type-primary-state-default-background)}
.v1-uno{color:var(--text-muted);font:var(--label-sm-bold);min-width:2.2em}
.v1-unote{color:var(--text-muted);font:var(--body-sm);margin:var(--spacing-4) 0 0}
.v1-item.planned{opacity:.62}.v1-item.planned .v1-num{background:transparent;border:1px dashed var(--border-default,#c9ced6)}
.v1-pill.planned{background:var(--component-tag-color-neutral-surface);color:var(--component-tag-color-neutral-text-color)}
.v1-extra{margin-top:var(--spacing-16)}
.v1-unit{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--spacing-8);margin:var(--spacing-16) 0 0;font:var(--body-md-bold)}
.v1-unit small{color:var(--text-muted);font:var(--label-xs)}
.v1-refdoc{display:flex;justify-content:space-between;gap:var(--spacing-8);padding:var(--spacing-12) 0 0;font:var(--body-sm-bold)}
.v1-purpose{margin:0;font:var(--body-lg);padding:var(--spacing-12) var(--spacing-16);background:var(--surface-secondary);border-left:3px solid var(--border-primary);border-radius:0 var(--radius-md) var(--radius-md) 0}
.v1-kp{margin:var(--spacing-12) 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:var(--spacing-12);counter-reset:kp}
.v1-kp li{display:grid;grid-template-columns:24px 1fr;gap:var(--spacing-8);counter-increment:kp;font:var(--body-lg)}
.v1-kp li::before{content:counter(kp);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:var(--label-sm-bold);color:var(--text-primary);background:var(--action-selected);margin-top:2px}
.v1-kp .v1-cites{grid-column:2;display:flex;flex-wrap:wrap;gap:var(--spacing-4)}
.v1-cite{font:var(--label-xs);color:var(--text-muted);background:var(--surface-secondary);border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:1px var(--spacing-6);cursor:pointer}
.v1-cite:hover{color:var(--text-primary);border-color:var(--border-primary)}
.v1-sources{display:flex;flex-direction:column;gap:var(--spacing-8);margin-top:var(--spacing-8)}
.v1-sources .v1-guide{margin-top:0}
.v1-sources .v1-guide summary::after{display:none}
.v1-sources .v1-guide summary{gap:var(--spacing-8);align-items:center}
.v1-guide summary>span:first-child{flex:1}
.v1-tag{font:var(--label-xs);color:var(--text-muted);white-space:nowrap}
.v1-guide.flash summary{box-shadow:var(--component-checkbox-state-selected-focus-focus-ring)}
.v1-guide-body td.v1-grp{background:var(--surface-secondary);font:var(--body-sm-bold)}
.v1-people{display:flex;gap:var(--spacing-8);flex-wrap:wrap;margin:var(--spacing-8) 0 0}
.v1-people button{appearance:none;height:var(--component-tag-size-xs-height);padding:0 var(--component-tag-size-xs-padding-x);border:var(--component-tag-color-outline-border-width) solid var(--component-tag-color-outline-border-color);background:var(--component-tag-color-outline-surface);color:var(--component-tag-color-outline-text-color);border-radius:var(--component-tag-type-pill-border-radius);font:var(--label-sm);cursor:pointer}
.v1-people button.on{background:var(--component-tag-color-solid-surface);border-color:var(--component-tag-color-solid-surface);color:var(--component-tag-color-solid-text-color)}
/* assignment form (담당자) */
/* toast */
.v1-toast{position:fixed;left:50%;bottom:calc(var(--spacing-24) + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--component-toast-surface);color:var(--component-toast-text-color);padding:var(--spacing-12) var(--component-toast-padding);border-radius:var(--component-toast-border-radius);font:var(--component-toast-text-typography);max-width:90vw;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.v1-toast.show{opacity:1}
.v1-link{appearance:none;border:0;background:none;padding:0;color:var(--component-text-button-type-link-color-default-text);font:var(--component-text-button-type-link-typography);text-decoration:underline;cursor:pointer}
@media(min-width:720px){ /* wds-allow: 브레이크포인트 토큰 없음 */.v1-top{padding:0 var(--component-layout-content-padding-x)}}
</style>
</head>
<body class="auth-pending">
<section id="authGate" class="auth-gate" aria-label="로그인"></section>
<div id="appShell" inert aria-hidden="true">
  <header class="v1-top">
    <button id="v1Back" class="v1-back" hidden aria-label="뒤로">‹</button>
    <h1 id="v1Title">모모스 온보딩</h1>
    <button id="v1Who" class="v1-who" title="내 계정">…</button>
  </header>
  <div id="v1Dev" class="v1-dev" hidden></div>
  <main id="app" class="v1-main"></main>
  <div id="v1Toast" class="v1-toast" role="status"></div>
</div>
<dialog id="accountDialog"></dialog>
<span id="accountName" hidden></span><span id="accountInitial" hidden></span>
<script src="/auth.js"></script>
<script src="/v1.js"></script>
</body>
</html>
