.v1-branch-icon svg{width:28px;height:28px} /* wds-allow: 아이콘 크기 */
.v1-branch-name{font:var(--body-lg-bold)}
.v1-branch-soon{font:var(--label-xs);color:var(--text-default-disabled)}
.v1-branch-card:disabled{cursor:not-allowed;background:var(--surface-default-disabled);border-color:var(--border-default-disabled);color:var(--text-default-disabled)}
.v1-branch-card:disabled .v1-branch-icon{background:var(--surface-fill-disabled);color:var(--icon-default-disabled)}
@media(min-width:720px){ /* wds-allow: 브레이크포인트 토큰 없음 */.v1-top{padding:0 var(--component-layout-content-padding-x)}}
