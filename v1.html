.v1-branch h2{margin:var(--spacing-8) 0 var(--spacing-4);font:var(--title-sm-bold);color:var(--text-default)}
.v1-branches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--spacing-12);margin-top:var(--spacing-20)}
.v1-branch-card{appearance:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--spacing-12);min-height:160px;padding:var(--spacing-20) var(--spacing-12);border:1px solid var(--border-default);border-radius:var(--radius-xl);background:var(--surface-default);color:var(--text-default);cursor:pointer;font:inherit} /* wds-allow: 카드 최소 높이 */
.v1-branch-card:not(:disabled):hover{border-color:var(--border-primary);background:var(--action-hover)}
.v1-branch-card:focus-visible{outline:none;box-shadow:var(--component-checkbox-state-selected-focus-focus-ring)}
.v1-branch-icon{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--action-selected);color:var(--icon-primary)} /* wds-allow: 아이콘 원 크기 */
.v1-branch-icon svg{width:28px;height:28px} /* wds-allow: 아이콘 크기 */
.v1-branch-name{font:var(--body-lg-bold)}
.v1-branch-soon{font:var(--label-xs);color:var(--text-default-disabled)}
.v1-branch-card:disabled{cursor:not-allowed;background:var(--surface-default-disabled);border-color:var(--border-default-disabled);color:var(--text-default-disabled)}
.v1-branch-card:disabled .v1-branch-icon{background:var(--surface-fill-disabled);color:var(--icon-default-disabled)}
/* 더보기(⋮) = icon button ghost md round. WDS 0.4.0 에 세로 점 3개 아이콘이 없어 직접 그린다 */
.v1-more{position:relative;flex:none;margin-right:calc(-1 * var(--spacing-8))}
.v1-more[hidden]{display:none}
.v1-icon-btn{appearance:none;border:0;display:grid;place-items:center;padding:var(--component-icon-button-type-ghost-size-md-round-default-padding);border-radius:var(--component-icon-button-type-ghost-size-md-round-default-radius);background:var(--component-icon-button-type-ghost-state-default-background);color:var(--icon-default);cursor:pointer}
.v1-icon-btn:hover{background:var(--component-icon-button-type-ghost-state-hover-background)}
.v1-icon-btn:active,.v1-icon-btn[aria-expanded="true"]{background:var(--component-icon-button-type-ghost-state-pressed-background)}
.v1-icon-btn svg{width:var(--component-icon-button-type-ghost-size-md-round-default-icon-size);height:var(--component-icon-button-type-ghost-size-md-round-default-icon-size)}
/* 메뉴 = popover 표면 + menu item */
.v1-menu{position:absolute;right:0;top:calc(100% + var(--spacing-4));min-width:168px; /* wds-allow: 메뉴 최소 폭 */padding:var(--spacing-4);background:var(--surface-default);border-radius:var(--component-popover-base-border-radius);box-shadow:var(--component-popover-base-shadow);z-index:var(--component-layout-z-index-gnb)}
.v1-menu[hidden]{display:none}
.v1-menu button{appearance:none;border:0;display:flex;align-items:center;gap:var(--component-menu-item-base-content-gap);width:100%;height:var(--component-menu-item-base-height);padding:0 var(--component-menu-item-base-padding-x);border-radius:var(--component-menu-item-base-radius);background:transparent;color:var(--component-menu-item-state-default-label-text-color);font:var(--component-menu-item-state-default-label-typography);white-space:nowrap;cursor:pointer;text-align:left}
.v1-menu button:hover{background:var(--component-menu-item-state-hover-background);color:var(--component-menu-item-state-hover-label-text-color)}
/* PDF 내보내기: 화면에는 숨기고, 인쇄할 때만 이 영역만 찍는다. 종이는 항상 밝은 배경이라 인쇄 색은 고정값 */
.v1-print{display:none}
@media print{
  @page{size:A4;margin:16mm 14mm}
  body.v1-printing > *:not(#v1Print){display:none !important}
  body.v1-printing #v1Print{display:block}
  .v1-print{color:#202124;font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;font-size:10.5pt;line-height:1.6} /* wds-allow: 인쇄 고정 색·크기 */
  .v1-print *{box-sizing:border-box}
  .v1-print .p-head{border-bottom:1.5pt solid #202124;padding-bottom:6pt;margin-bottom:12pt} /* wds-allow */
  .v1-print .p-brand{font-size:9pt;color:#6b6e75} /* wds-allow */
  .v1-print .p-meta{margin-top:2pt;font-size:9.5pt;color:#3a3d42} /* wds-allow */
  .v1-print .p-tag{display:inline-block;padding:0 5pt;margin-right:4pt;border:0.75pt solid #3a3d42;border-radius:3pt;font-size:8.5pt} /* wds-allow */
  .v1-print h1{margin:4pt 0 0;font-size:16pt;line-height:1.35} /* wds-allow */
  .v1-print h2{margin:14pt 0 4pt;font-size:11.5pt;break-after:avoid} /* wds-allow */
  .v1-print p{margin:0 0 4pt}
  .v1-print ol,.v1-print ul{margin:0;padding-left:16pt} /* wds-allow */
  .v1-print li{margin:0 0 5pt;break-inside:avoid}
  .v1-print .p-src{display:block;font-size:8.5pt;color:#6b6e75} /* wds-allow */
  .v1-print .p-note{margin:6pt 0;padding:5pt 8pt;border-left:2pt solid #a86400;background:#fff6e5} /* wds-allow */
  .v1-print .p-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8pt;margin:8pt 0} /* wds-allow */
  .v1-print figure{margin:0;break-inside:avoid}
  .v1-print figure img{display:block;width:100%;height:42mm;object-fit:contain;background:#fff;border:0.5pt solid #d9dadd;border-radius:3pt} /* wds-allow */
  .v1-print figcaption{font-size:8.5pt;color:#6b6e75;margin-top:2pt} /* wds-allow */
  .v1-print .p-checks{list-style:none;padding:0;break-inside:avoid}
  .v1-print .p-checks li{display:flex;gap:8pt;align-items:flex-start}
  .v1-print .p-box{flex:none;width:11pt;height:11pt;margin-top:2.5pt;border:1pt solid #202124;border-radius:2pt} /* wds-allow */
  .v1-print .p-foot{margin-top:18pt;padding-top:6pt;border-top:0.5pt solid #d9dadd;font-size:8.5pt;color:#6b6e75} /* wds-allow */
}
@media(min-width:720px){ /* wds-allow: 브레이크포인트 토큰 없음 */.v1-top{padding:0 var(--component-layout-content-padding-x)}}
</style>
</head>
<body class="auth-pending">
<section id="authGate" class="auth-gate" aria-label="로그인"></section>
<div id="appShell" inert aria-hidden="true">
  <header class="v1-top">
    <button id="v1Back" class="v1-back" hidden aria-label="뒤로">‹</button>
    <div class="v1-titlebox"><span id="v1Stage" class="v1-stage-tag" hidden></span><h1 id="v1Title">모모스 온보딩</h1></div>
    <button id="v1Who" class="v1-who" title="내 계정">…</button>
    <div id="v1More" class="v1-more" hidden>
      <button id="v1MoreBtn" class="v1-icon-btn" aria-label="더보기" aria-haspopup="menu" aria-expanded="false" aria-controls="v1Menu"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="4.5" r="1.5" fill="currentColor"/><circle cx="10" cy="10" r="1.5" fill="currentColor"/><circle cx="10" cy="15.5" r="1.5" fill="currentColor"/></svg></button><!-- wds-allow: 세로 점 3개 아이콘 없음 -->
      <div id="v1Menu" class="v1-menu" role="menu" hidden><button type="button" role="menuitem" id="v1ExportPdf">PDF로 내보내기</button></div>
    </div>
  </header>
  <div id="v1Dev" class="v1-dev" hidden></div>
  <main id="app" class="v1-main"></main>
  <div id="v1Toast" class="v1-toast" role="status"></div>
</div>
<div id="v1Print" class="v1-print" aria-hidden="true"></div>
<dialog id="accountDialog"></dialog>
<span id="accountName" hidden></span><span id="accountInitial" hidden></span>
<script src="/auth.js"></script>
<script src="/v1.js"></script>
</body>
</html>
