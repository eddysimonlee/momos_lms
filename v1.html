<style>
/* v1 — service CSS. Tokens come from WDS 0.4.0 (vendored at /wds/web/variables.css, never edited).

@font-face{font-family:Pretendard;font-style:normal;font-weight:45 920;font-display:swap;src:url('/assets/PretendardVariable.woff2') format('woff2')}
/* 페이지 기본값 — ERP 의 styles.css 는 쓰지 않는다(10/29). 모든 값은 WDS 토큰 */

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--surface-default);color:var(--text-default);font:var(--body-lg);font-family:var(--font-family),-apple-system,BlinkMacSystemFont,sans-serif}

[hidden]{display:none !important}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}

a{color:var(--text-primary)}
img{max-width:100%}
.auth-pending #appShell{display:none}
#appShell{min-height:100svh;background:var(--surface-default);color:var(--text-default);font:var(--body-lg);font-family:var(--font-family),-apple-system,BlinkMacSystemFont,sans-serif}
#appShell *{box-sizing:border-box;font-family:inherit}
/* top bar = gnb type default */

/* 항목 화면: 제목 위에 현재 단계(WDS Tag · info · square · xs). 단계가 붙으면 상단 바가 두 줄 높이로 늘어난다 */
.v1-titlebox{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:var(--spacing-2)}

.v1-stage-tag{display:inline-flex;align-items:center;max-width:100%;height:var(--component-tag-size-xs-height);padding:0 var(--component-tag-size-xs-padding-x);border-radius:var(--component-tag-type-square-border-radius);background:var(--component-tag-color-info-surface);color:var(--component-tag-color-info-text-color);font:var(--component-tag-size-xs-text-typography);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v1-stage-tag[hidden]{display:none}
.v1-top h1{max-width:100%;margin:0;font:var(--title-xs-bold);color:var(--text-default);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.v1-avatar{position:relative;flex:none;display:inline-grid;place-items:center;width:var(--spacing-32);height:var(--spacing-32);border-radius:var(--radius-full);overflow:hidden;background:var(--action-selected);color:var(--icon-primary);font:var(--label-sm-bold);vertical-align:middle}

.v1-people .v1-avatar{width:var(--spacing-20);height:var(--spacing-20);font:var(--label-xs-bold);margin-right:var(--spacing-4)}
.v1-main{max-width:600px; /* wds-allow: 읽기 폭 상한, 레이아웃 토큰 없음 */margin:0 auto;padding:var(--spacing-16) var(--spacing-16) var(--spacing-48)}
.v1-card{background:var(--surface-subtle);border:var(--v1-hairline) solid var(--border-subtle);border-radius:var(--radius-xl);padding:var(--spacing-16);margin-bottom:var(--spacing-12)}

.v1-note{display:block;min-height:var(--component-banner-base-height);padding:var(--component-banner-base-padding-y) var(--component-banner-type-round-padding-x);border-radius:var(--component-banner-type-round-radius);background:var(--component-banner-color-gray-surface);color:var(--component-banner-color-gray-text);font:var(--component-banner-base-typography);margin:var(--spacing-12) 0 0}
.v1-note.warn{background:var(--component-banner-color-yellow-surface);color:var(--component-banner-color-yellow-text)}

.v1-item .v1-chev{color:var(--icon-subtle);font:var(--body-xl)}
/* status pill = tag xxs pill */
.v1-pill{display:inline-flex;align-items:center;height:var(--component-tag-size-xxs-height);padding:0 var(--component-tag-size-xxs-padding-x);border-radius:var(--component-tag-type-pill-border-radius);font:var(--label-xs-bold);background:var(--component-tag-color-neutral-surface);color:var(--component-tag-color-neutral-text-color);vertical-align:middle}
.v1-pill.practice{background:var(--component-tag-color-info-surface);color:var(--component-tag-color-info-text-color)}

.v1-pill.done{background:var(--component-tag-color-success-surface);color:var(--component-tag-color-success-text-color)}
.v1-copy p{margin:0 0 var(--spacing-8);font:var(--body-lg)}
.v1-photo{margin:var(--spacing-12) 0 0}.v1-photo img{width:100%;border-radius:var(--radius-lg);display:block}.v1-photo figcaption{color:var(--text-muted);font:var(--label-sm);margin-top:var(--spacing-4)}
.v1-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr)) /* wds-allow: 사진 칸 최소 폭 */;gap:var(--spacing-12);margin:var(--spacing-12) 0 0}.v1-photos .v1-photo{margin:0;min-width:0}.v1-photos .v1-photo img{height:auto;max-height:420px; /* wds-allow: 사진 최대 높이 */object-fit:contain;background:var(--surface-muted)}
.v1-photos .v1-photo-wide{grid-column:1/-1}.v1-photos .v1-photo-wide img{max-height:none}
/* checks = checkbox item (checkbox-size control + md label); the whole row is the tap target */
.v1-checks{list-style:none;margin:var(--spacing-8) 0 0;padding:0;display:flex;flex-direction:column;gap:var(--spacing-8)}
.v1-checks>li{border:var(--v1-hairline) solid var(--border-default);border-radius:var(--radius-lg);background:var(--surface-default);overflow:hidden}
.v1-checks>li:has(input:checked){background:var(--action-selected);border-color:var(--border-primary)}

.v1-checks input{position:absolute;opacity:0;width:var(--v1-hairline);height:var(--v1-hairline);margin:0}
.v1-checks .v1-box{flex:none;width:var(--component-checkbox-size);height:var(--component-checkbox-size);margin-top:var(--spacing-2);border-radius:var(--component-checkbox-radius);border:var(--component-checkbox-border-width) solid var(--component-checkbox-state-default-border);background:var(--component-checkbox-state-default-background);display:grid;place-items:center}
.v1-checks label:hover .v1-box{border-color:var(--component-checkbox-state-hover-border)}
.v1-checks input:checked+.v1-box{background:var(--component-checkbox-state-selected-background);border-color:var(--component-checkbox-state-selected-background)}
.v1-checks input:checked+.v1-box::after{content:'';width:5px;height:9px;border:solid var(--component-checkbox-state-selected-icon-color);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)} /* wds-allow: 체크 표시 도형, 아이콘 자산은 2차에 mono/16/check.svg로 교체 */

.v1-memo{width:100%;min-height:var(--spacing-72);border:var(--v1-hairline) solid var(--component-input-type-square-state-default-border);border-radius:var(--component-input-type-square-size-md-radius);padding:var(--spacing-8) var(--component-input-type-square-size-md-padding-x);font:var(--component-input-type-square-size-md-typography);color:var(--text-default);resize:vertical;background:var(--component-input-type-square-state-default-background)}

.v1-actions{position:sticky;bottom:0;background:var(--surface-default);padding:var(--spacing-12) 0 calc(var(--spacing-8) + env(safe-area-inset-bottom));display:flex;gap:var(--spacing-8)}

.v1-stages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--spacing-8);margin:var(--spacing-16) 0 0}
.v1-stages button{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:var(--spacing-8);text-align:left;padding:var(--spacing-10) var(--spacing-12);border:var(--v1-hairline) solid var(--border-default);border-radius:var(--radius-lg);background:var(--surface-default);color:inherit;cursor:pointer;min-width:0}

.v1-nav-panel{position:absolute;top:0;bottom:0;left:0;width:min(var(--component-lnb-type-basic-width) + var(--spacing-40),85vw);display:flex;flex-direction:column;background:var(--component-lnb-base-background);box-shadow:var(--component-popover-base-shadow);padding-bottom:env(safe-area-inset-bottom)}

/* PDF 내보내기: 화면에는 숨기고, 인쇄할 때만 이 영역만 찍는다. 종이는 항상 밝은 배경이라 인쇄 색은 고정값 */
.v1-print{display:none}
@media print{
  @page{size:A4;margin:16mm 14mm}
  body.v1-printing > *:not(#v1Print){display:none !important}
  body.v1-printing #v1Print{display:block}
  .v1-print{color:#202124;font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;font-size:10.5pt;line-height:1.6} /* wds-allow: 인쇄 고정 색·크기 */
  .v1-print *{box-sizing:border-box}
  .v1-print .p-head{border-bottom:1.5pt solid #202124;padding-bottom:6pt;margin-bottom:12pt} /* wds-allow */
  .v1-print .p-brand{font-size:9pt;color:#6b6e75} /* wds-allow */
  .v1-print .p-meta{margin-top:2pt;font-size:9.5pt;color:#3a3d42} /* wds-allow */
  .v1-print .p-tag{display:inline-block;padding:0 5pt;margin-right:4pt;border:0.75pt solid #3a3d42;border-radius:3pt;font-size:8.5pt} /* wds-allow */
  .v1-print h1{margin:4pt 0 0;font-size:16pt;line-height:1.35} /* wds-allow */
  .v1-print h2{margin:14pt 0 4pt;font-size:11.5pt;break-after:avoid} /* wds-allow */
  .v1-print p{margin:0 0 4pt}
  .v1-print ol,.v1-print ul{margin:0;padding-left:16pt} /* wds-allow */
  .v1-print li{margin:0 0 5pt;break-inside:avoid}
  .v1-print .p-src{display:block;font-size:8.5pt;color:#6b6e75} /* wds-allow */
  .v1-print .p-note{margin:6pt 0;padding:5pt 8pt;border-left:2pt solid #a86400;background:#fff6e5} /* wds-allow */
  .v1-print .p-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8pt;margin:8pt 0} /* wds-allow */
  .v1-print figure{margin:0;break-inside:avoid}
  .v1-print figure img{display:block;width:100%;height:42mm;object-fit:contain;background:#fff;border:0.5pt solid #d9dadd;border-radius:3pt} /* wds-allow */
  .v1-print figcaption{font-size:8.5pt;color:#6b6e75;margin-top:2pt} /* wds-allow */
  .v1-print .p-checks{list-style:none;padding:0}
  .v1-print .p-checks li{break-inside:avoid;margin:0 0 6pt}
  .v1-print .p-checks li{display:flex;gap:8pt;align-items:flex-start}
  .v1-print .p-box{flex:none;width:11pt;height:11pt;margin-top:2.5pt;border:1pt solid #202124;border-radius:2pt} /* wds-allow */
  .v1-print .p-foot{margin-top:18pt;padding-top:6pt;border-top:0.5pt solid #d9dadd;font-size:8.5pt;color:#6b6e75} /* wds-allow */
}
@media(min-width:720px){ /* wds-allow: 브레이크포인트 토큰 없음 */.v1-top{padding:0 var(--component-layout-content-padding-x)}}
</style>
</head>
