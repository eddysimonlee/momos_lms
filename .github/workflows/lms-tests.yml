name: LMS tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax checks
        run: |
          python -m py_compile server.py lms_store.py access.py invitations.py cloud.py manual_wiki.py workspace_items.py onboarding.py
          node --check auth.js
          node --check onboarding.js
          node --check workspace_items.js
      - name: Python tests
        run: python -B -m unittest discover -p '*_test.py'
      - name: Browser behaviour tests
        run: |
          node --test *_test.cjs
