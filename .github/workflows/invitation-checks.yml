name: Invitation and access checks
on:
  pull_request:
    paths:
      - 'access.py'
      - 'invitations.py'
      - 'projects.py'
      - 'auth.js'
      - 'workspace.js'
      - 'invitation_config_test.py'
      - '.github/workflows/invitation-checks.yml'
permissions:
  contents: read
jobs:
  invitation-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax checks
        run: |
          python -m py_compile access.py invitations.py projects.py invitation_config_test.py
          node --check auth.js
          node --check workspace.js
      - name: Isolated authorization and invitation regressions
        run: python -B -m unittest invitation_config_test access_test projects_test
