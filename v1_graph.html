<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모모스 교육·원본 연결도</title>
<link rel="icon" href="/icons/momos-erp.svg">
<link rel="stylesheet" href="/wds/web/variables.css">
<style>
/* /v1/graph — 교육항목 ↔ 원본 문서 연결도. 데이터는 화면과 같은 /v1_content.json 에서 매번 계산한다(항상 최신).
   색은 WDS 의미 토큰으로 매핑, 단계 구분색만 wds-allow. */
@font-face{font-family:Pretendard;font-style:normal;font-weight:45 920;font-display:swap;src:url('/assets/PretendardVariable.woff2') format('woff2')}
body{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top a{color:var(--accent);font-size:13px;text-decoration:none}
.top a:hover{text-decoration:underline}
.msg{padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
/* Layout: 왼쪽 원본 문서(폴더별) ↔ 오른쪽 교육항목(단계별) 이분 연결도 + 오른쪽 상세 패널. 폭이 좁으면 패널이 아래로. */
:root{
  --bg:var(--surface-subtle); --panel:var(--surface-default); --fg:var(--text-default); --muted:var(--text-muted); --line:var(--border-default);
  --edge:var(--border-strong); --accent:var(--text-primary); --accent-soft:var(--action-selected); --warn:var(--text-warning); --warn-soft:var(--surface-warning-subtle);
  /* wds-allow: 단계 구분색 6개는 대응 토큰이 없다(연결도 범례 전용) */
  --stage1:#4a7c8c; --stage2:#6b7f3a; --stage3:#a0622c; --stage4:#7a5a93; --stage5:#9b4a5a; --stage6:#3f5f9a;
  --sans:Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  --mono:ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header h1{font-size:22px;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.3px}
header p{margin:4px 0 0;color:var(--muted);word-break:keep-all}  /* 넓은 화면에서 한 줄, 좁으면 단어 단위로 줄바꿈 */
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:10px;font-size:13px;color:var(--muted)}
.stats b{font:500 18px var(--mono);color:var(--fg);margin-right:4px;font-variant-numeric:tabular-nums}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input{flex:1 1 220px;min-width:0;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
.bar input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.graph{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto;min-width:0}
.graph svg{display:block}
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:max(12px,env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto;min-width:0}
@media (max-width:900px){.side{position:static;max-height:none;order:-1}}
svg .node:focus{outline:none}svg .node:focus-visible circle{stroke:var(--accent);stroke-width:3}
.side h2{font-size:16px;margin:0 0 4px;text-wrap:balance;overflow-wrap:anywhere}
.side .meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.side h3{font-size:12px;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px;font-weight:600}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:4px}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.rel{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rel li{border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.rel li:hover{border-color:var(--accent)}
.rel .t{font-weight:600;font-size:13px}
.rel .n{font-size:12px;color:var(--fg);margin-top:2px}
.rel .s{font-size:12px;color:var(--muted);margin-top:2px}
.secs{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:1px 8px;margin-top:6px;font-size:12px;color:var(--muted)}
.secs .sh{grid-column:1/-1;font-weight:600;margin-bottom:2px}
.secs .wide{grid-column:1/-1}.secs .no{font-variant-numeric:tabular-nums;color:var(--fg)}
.crumb{margin-bottom:4px}.unit{font-size:13px;color:var(--muted);margin-bottom:2px}.rel .unit{font-size:12px}.rq .sub .t{font-weight:600;color:var(--fg);font-size:14px}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rank li{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:8px;align-items:center;cursor:pointer;padding:3px 4px;border-radius:6px;font-size:12px}
.rank li:hover{background:var(--accent-soft)}
.rank .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .track{grid-column:1/-1;height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:-2px}
.rank .track i{display:block;height:100%;background:var(--accent)}
.rank .v{font:12px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
svg text{fill:var(--fg);font-family:var(--sans)}
svg .grp{font-size:11px;font-weight:600;fill:var(--muted);letter-spacing:.04em}
svg .top{font-size:12px;font-weight:700;fill:var(--fg)}
h1 .asof{font-weight:500;color:var(--muted);font-size:.8em}
/* 열 제목: 왼쪽 = 고객사 knowledge base(원본 문서), 오른쪽 = 그것으로 만든 LMS content(교육항목) */
svg .colh{font-size:15px;font-weight:700;fill:var(--fg)}
svg .cols{font-size:11px;fill:var(--muted)}
svg .colrule{stroke:var(--line);stroke-width:1}
svg .flow{font-size:11px;fill:var(--muted);letter-spacing:.04em}
svg .node{cursor:pointer}
svg .node text{font-size:12px}
svg .node .cnt{font:10px var(--mono);fill:var(--muted)}
svg path.e{fill:none;stroke:var(--edge);stroke-opacity:.28}
svg.focus path.e{stroke-opacity:.05}
svg.focus path.e.on{stroke:var(--accent);stroke-opacity:.85}
svg.focus .node{opacity:.28}
svg.focus .node.on{opacity:1}
svg .node.sel text{font-weight:700}
svg .node.hit text{fill:var(--accent);font-weight:700}
.foot{font-size:12px;color:var(--muted)}
/* 11/05 프로필 메뉴(이름·이메일·로그아웃) — 교육 화면과 같은 동작 */
.me{position:relative}
.av{position:relative;width:32px;height:32px;border-radius:999px;border:0;padding:0;overflow:hidden;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:700 13px var(--sans);cursor:pointer}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.me-menu{position:absolute;right:0;top:calc(100% + 4px);min-width:180px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--component-popover-base-shadow,0 4px 16px rgba(0,0,0,.12));z-index:30}  /* wds-allow: 그림자 대체값 */
.me-who{display:flex;flex-direction:column;padding:8px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}.me-who b{font-size:13px}.me-who small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.me-menu button{display:block;width:100%;text-align:left;font:inherit;font-size:14px;border:0;background:none;color:var(--fg);padding:8px 12px;border-radius:6px;cursor:pointer}.me-menu button:hover{background:var(--accent-soft)}
.out{max-width:360px;margin:48px auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}.out h2{margin:0;font-size:18px}.out p{margin:0;color:var(--muted)}.out a{background:var(--accent);color:var(--panel);padding:10px 16px;border-radius:8px;text-decoration:none;font-weight:600}
/* 11/03 콘텐츠 수정 요청(admin): 패널의 '수정 요청' 버튼 → 대화상자(AS-IS 자동, TO-BE 입력) */
.reqbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface-default)}
.reqs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.reqs li{border:1px dashed var(--line);border-radius:8px;padding:6px 10px;font-size:12px}
.reqs .h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--muted)}
.reqs .b{margin-top:2px;overflow-wrap:anywhere}
.st{font-size:11px;padding:0 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.st.done{background:var(--component-tag-color-success-surface);color:var(--component-tag-color-success-text-color)}
.st.no{background:var(--component-tag-color-error-surface);color:var(--component-tag-color-error-text-color)}
dialog.rq{border:1px solid var(--line);border-radius:14px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px);background:var(--panel);color:var(--fg)}
dialog.rq::backdrop{background:rgba(0,0,0,.35)}  /* wds-allow: 대화상자 뒤 배경(대응 토큰 없음) */
.rq form{display:flex;flex-direction:column;gap:12px;padding:18px}
.rq h2{font-size:16px;margin:0}
.rq .sub{font-size:12px;color:var(--muted);margin-top:-8px}
.rq label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.rq select,.rq textarea{font:inherit;font-size:14px;font-weight:400;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.rq textarea{min-height:84px;resize:vertical}
.rq .types{display:flex;flex-wrap:wrap;gap:6px}
.rq .types button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer}
.rq .types button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.rq .asis{font-size:13px;font-weight:400;color:var(--fg);background:var(--bg);border-radius:8px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:160px;overflow:auto}
.rq .hint{font-size:12px;color:var(--muted);font-weight:400}
.rq .act{display:flex;justify-content:flex-end;gap:8px}
.gtoast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;max-width:calc(100vw - 32px);background:var(--fg);color:var(--panel);border-radius:10px;padding:12px 16px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.18)}  /* wds-allow: 토스트 그림자(대응 토큰 없음) */
.gtoast[hidden]{display:none}
.reqs li.new{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.rq input[type=text]{font:inherit;font-size:14px;font-weight:400;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.rq .tobe2{display:flex;flex-direction:column;gap:10px}
.rq .err{color:var(--text-danger,var(--warn));font-size:12px}
@media (prefers-reduced-motion:no-preference){svg path.e,svg .node{transition:opacity .15s,stroke-opacity .15s}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><a href="/v1">← 교육 화면으로</a><div class="me" id="me" hidden><button type="button" class="av" id="meBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="meMenu"></button><div class="me-menu" id="meMenu" role="menu" hidden><div class="me-who"><b id="meName"></b><small id="meMail"></small></div><button type="button" role="menuitem" id="meLogout">로그아웃</button></div></div></div>
    <h1>교육항목 ↔ 원본 문서 연결도 <span class="asof" id="asof">(10/22)</span></h1>
    <p>문서나 교육항목을 누르면 연결된 쪽과 인용한 절이 오른쪽에 나옵니다. 선이 굵을수록 인용 횟수가 많습니다.</p>
    <div class="stats" id="stats"></div>
  </header>
  <div class="bar">
    <input id="q" type="search" placeholder="문서·교육항목 이름 검색 (예: 제빙기, 레시피)" aria-label="문서·교육항목 검색">
    <button class="btn" id="reset" type="button">선택 해제</button>
  </div>
  <div class="legend" id="legend"></div>
  <div class="main">
    <div class="graph" id="graph"></div>
    <aside class="side" id="side" aria-live="polite"></aside>
  </div>
  <p class="foot" id="foot"></p>
</div>
<div class="gtoast" id="gtoast" role="status" aria-live="polite" hidden></div>
<dialog class="rq" id="rq" aria-labelledby="rqTitle"><form method="dialog" id="rqForm"></form></dialog>

<script>
// 로그인: 교육 화면(/v1)과 같다. WORKS 로그인 서버는 새로 열 때마다 WORKS 에 다시 확인하고, 로그인 후 이 화면으로 돌아온다.
// (WORKS 설정 전 체험 서버에서만 /api/dev/accounts 자동 로그인)
async function autoLogin() {
  try {
    const status = await fetch('/api/auth/status', {credentials: 'same-origin', cache: 'no-store'}).then(r => r.json());
    if (status.works) {
      let out = false; try { out = sessionStorage.getItem('v1.loggedOut') === '1'; } catch {}
      if (out && !status.user) {  // 11/05 방금 로그아웃: 자동 재로그인하지 않고 안내
        document.querySelector('.wrap').innerHTML = '<div class="out"><h2>로그아웃했어요</h2><p>다시 들어오려면 NAVER WORKS로 로그인해 주세요.</p><a href="/auth/works/login?next=graph" id="relogin">NAVER WORKS로 로그인</a></div>';
        document.getElementById('relogin').onclick = () => { try { sessionStorage.removeItem('v1.loggedOut'); sessionStorage.setItem('v1.worksVisit', '1'); } catch {} };
        return new Promise(() => {});
      }
      try { sessionStorage.removeItem('v1.loggedOut'); } catch {}
      let checked = true; try { checked = sessionStorage.getItem('v1.worksVisit') === '1'; } catch {}
      if (!status.user || !checked) {
        try { sessionStorage.setItem('v1.worksVisit', '1'); } catch {}
        location.replace('/auth/works/login?next=graph');
        return new Promise(() => {});
      }
      return;
    }
    if (status.user) return;
    const r = await fetch('/api/dev/accounts', {credentials: 'same-origin', cache: 'no-store'});
    if (!r.ok) return;
    const {accounts} = await r.json();
    const pick = accounts.find(a => a.email === 'learner@local.test') || accounts[0];
    if (pick) await fetch('/api/dev/accounts?id=' + encodeURIComponent(pick.id), {method: 'POST', credentials: 'same-origin', headers: {'Content-Type': 'application/json'}, body: '{}'});
  } catch {}
}
// 교육 화면 데이터 → 연결도: 교육 내용 요약·수행 확인 문항·사진이 단 근거 절을 문서 단위로 합친다.
function buildGraph(c) {
  const items = [], edges = new Map(); let no = 0;
  for (const u of c.units) for (const s of u.steps) {
    no++;
    items.push({id: s.id, no, title: s.title, unit: `${u.no} ${u.title}`, stage: u.stage.order, stageTitle: u.stage.title});
    // kp/check/photo = 인용 횟수(선 굵기), at = 그 문서를 근거로 쓴 자리(교육 내용 n칸·체크 n개·사진 n장, 중복 없이)
    const add = (key, kind, idx) => {
      const sec = c.sections[key]; if (!sec) return;
      const k = s.id + '|' + sec.doc;
      if (!edges.has(k)) edges.set(k, {item: s.id, doc: sec.doc, kp: 0, check: 0, photo: 0, at: {kp: new Set(), check: new Set(), photo: new Set()}, secs: new Set()});
      const e = edges.get(k); e[kind]++; e.at[kind].add(idx); e.secs.add((sec.no ? sec.no + ' ' : '') + sec.title);
    };
    (s.keyPoints || []).forEach((k, i) => k.cites.forEach(x => add(x, 'kp', i)));
    (s.checkCites || []).forEach((cs, i) => cs.forEach(x => add(x, 'check', i)));
    (s.photos || []).forEach(p => { const ph = c.photos[p]; if (ph && ph.cite) add(ph.cite, 'photo', p); });
  }
  const used = new Set([...edges.values()].map(e => e.doc));
  const docs = Object.entries(c.documents).filter(([k]) => used.has(k)).map(([id, d]) => ({id, title: d.title, type: d.type, folder: d.folder || '', file: d.file, version: d.version}));
  return {docs, items, edges: [...edges.values()].map(e => ({...e, secs: [...e.secs].sort()})),
    meta: {curriculum: c.curriculumVersion || c.courseVersion, generated: (c.sourceIndexedAt || '').slice(0, 10)}};
}
(async () => {
await autoLogin();
const res = await fetch('/v1_content.json', {credentials: 'same-origin', cache: 'no-store'});
if (!res.ok) { document.querySelector('.main').innerHTML = '<div class="msg">로그인이 필요해요. <a href="/auth/works/login?next=graph">NAVER WORKS 로 로그인</a>한 뒤 다시 열어 주세요.</div>'; return; }
const C = await res.json();
const G = buildGraph(C);
// 11/03 수정 요청: LMS관리자(admin)에게만 '수정 요청' 버튼. 요청은 /api/onboarding(content.request)에 저장된다
let ME = null, CSRF = '';
try {
  const st = await fetch('/api/auth/status', {credentials: 'same-origin', cache: 'no-store'}).then(r => r.json()); CSRF = st.csrfToken || '';
  const r = await fetch('/api/onboarding', {credentials: 'same-origin', cache: 'no-store'}); if (r.ok) ME = await r.json();
} catch {}
const canReq = () => !!(ME && ME.lmsLevel === 'admin');

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 서버 UTC ISO → 한국 시각 'YYYY-MM-DD HH:MM'
const kstAt = a => { const v = String(a || ''); const t = /T.*(Z|[+-]\d\d:?\d\d)$/.test(v) && new Date(v);
  return (t && !isNaN(t) ? new Date(t.getTime() + 9 * 3600e3).toISOString() : v).slice(0, 16).replace('T', ' '); };
if (ME && ME.user) {
  const u = ME.user, nm = String(u.name || '?').trim();
  $('meBtn').innerHTML = `<span aria-hidden="true">${esc(nm.slice(0, 1))}</span><img src="/v1/avatar/${encodeURIComponent(u.id)}" alt="" loading="lazy" onerror="this.remove()">`;
  $('meBtn').setAttribute('aria-label', nm + ' 님 — 계정 메뉴'); $('meName').textContent = nm + ' 님'; $('meMail').textContent = u.email || ''; $('me').hidden = false;
  const closeMe = () => { $('meMenu').hidden = true; $('meBtn').setAttribute('aria-expanded', 'false'); };
  $('meBtn').onclick = e => { e.stopPropagation(); const open = $('meMenu').hidden; $('meMenu').hidden = !open; $('meBtn').setAttribute('aria-expanded', String(open)); if (open) $('meLogout').focus(); };
  document.addEventListener('click', e => { if (!$('me').contains(e.target)) closeMe(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('meMenu').hidden) { closeMe(); $('meBtn').focus(); } });
  $('meLogout').onclick = async () => {
    try { await fetch('/api/auth/logout', {method: 'POST', credentials: 'same-origin', headers: {'Content-Type': 'application/json', 'X-CSRF-Token': CSRF}, body: '{}'}); } catch {}

    `<div><div class="hint" style="margin-bottom:6px">종류</div><div class="types" role="group" aria-label="요청 종류">${TYPES[RQ.kind].map(x => `<button type="button" data-type="${esc(x)}" aria-pressed="${x === RQ.type}">${esc(x)}</button>`).join('')}</div></div>` +
    (t.length > 1 || RQ.kind === 'item' && RQ.type !== '기타' ? `<label>대상<select id="rqField">${t.map((x, i) => `<option value="${i}"${i === RQ.field ? ' selected' : ''}>${esc(x[0])}</option>`).join('')}</select></label>` : '') +
    (cur[1] ? `<label>${RQ.type === '원본 문서 변경 확인' ? 'AS IS 원본' : '지금 내용 (AS-IS)'}<div class="asis">${esc(cur[1])}</div></label>` : '') +
    // 11/03 원본 문서 변경: TO-BE = 새로 올린 파일 이름(바뀌었으면 고쳐 쓴다) + 바뀐 내용
    (RQ.type === '원본 문서 변경 확인' ? `<div class="tobe2"><div class="hint" style="font-weight:600;color:var(--muted)">TO BE 원본</div>` +
      `<label>새 파일 이름<input id="rqFile" type="text" maxlength="200" value="${esc(RQ.file || '')}" autocomplete="off"><span class="hint">${RQ.file && RQ.file !== docs.get(RQ.id).file ? '<b>파일 이름 바뀜</b> — ' : ''}파일명이 변경되었다면 그 이름으로 고쳐주세요. 그대로면 수정하지 않아도 됩니다.</span></label>` +
      `<label>바뀐 내용<textarea id="rqTobe" maxlength="4000" required>${esc(RQ.tobe || '')}</textarea><span class="hint">${esc(TOBE_HINT[RQ.type] || '')}</span></label></div>`
    : del ? '' : `<label>바꿀 내용 (TO-BE)<textarea id="rqTobe" maxlength="4000" required>${esc(RQ.tobe || '')}</textarea><span class="hint">${esc(TOBE_HINT[RQ.type] || '')}</span></label>`) +
    `<label>메모 (이유·근거, 선택)<textarea id="rqNote" maxlength="2000" style="min-height:56px">${esc(RQ.note || '')}</textarea></label>` +
    (RQ.err ? `<div class="err" role="alert">${esc(RQ.err)}</div>` : '') +
    `<div class="act"><button type="button" class="btn" data-close>닫기</button><button type="button" class="btn pri" data-send${RQ.busy ? ' disabled' : ''}>요청 보내기</button></div>`;
  const f = $('rqForm'), keep = () => { const a = f.querySelector('#rqTobe'), b = f.querySelector('#rqNote'), c = f.querySelector('#rqFile'); if (a) RQ.tobe = a.value; if (b) RQ.note = b.value; if (c) RQ.file = c.value; };
  const fi = f.querySelector('#rqFile'); if (fi) fi.onchange = () => { keep(); drawReq(); };
  f.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { keep(); RQ.type = b.dataset.type; RQ.field = 0; RQ.err = ''; drawReq(); });
  const fs = f.querySelector('#rqField'); if (fs) fs.onchange = () => { keep(); RQ.field = Number(fs.value); drawReq(); };
  f.querySelector('[data-close]').onclick = () => $('rq').close();
  f.querySelector('[data-send]').onclick = async () => {
    keep(); let tobe = del ? '(삭제)' : String(RQ.tobe || '').trim();
    if (!tobe) { RQ.err = RQ.type === '원본 문서 변경 확인' ? '바뀐 내용을 적어 주세요.' : '바꿀 내용을 적어 주세요.'; return drawReq(); }
    if (RQ.type === '원본 문서 변경 확인') {
      const nf = String(RQ.file || '').trim(), old = docs.get(RQ.id).file;
      if (!nf) { RQ.err = '새 파일 이름을 적어 주세요(그대로면 지금 이름).'; return drawReq(); }
      tobe = `파일: ${nf}${nf === old ? ' (이름 그대로)' : ' (이름 바뀜)'}\n바뀐 내용: ${tobe}`;
    }
    RQ.busy = true; drawReq();
    const uid = (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16)));
    try {
      const r = await fetch('/api/onboarding', {method: 'POST', credentials: 'same-origin', cache: 'no-store', headers: {'Content-Type': 'application/json', 'X-CSRF-Token': CSRF},
        body: JSON.stringify({action: 'content.request', target: ME.target, revision: ME.learner && ME.learner.revision, rootRevision: ME.rootRevision, requestId: uid,
          data: {target: {kind: RQ.kind, id: RQ.id, title: RQ.title}, type: RQ.type, field: RQ.type === '기타' && RQ.kind === 'item' ? '' : cur[0], asis: cur[1], tobe, note: String(RQ.note || '').trim()}})});
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || '요청을 보내지 못했어요.');
      const before = new Set((ME.contentRequests || []).map(x => x.id));
      ME = j; $('rq').close(); NEW_REQ = ((ME.contentRequests || []).find(x => !before.has(x.id)) || {}).id || null; panel();
      gtoast(`수정 요청을 보냈어요 · ${RQ.type}${cur[0] && RQ.kind === 'item' ? ' · ' + cur[0] : ''}. LMS관리자 › 수정 요청에서 처리 상태를 볼 수 있어요.`);
    } catch (e) { RQ.busy = false; RQ.err = e.message; drawReq(); }
  };
}
function pick(kind, id) {
  sel = id ? {kind, id} : null; highlight(kind, id); panel();
  if (id) { const n = S.querySelector(`.node[data-kind="${kind}"][data-id="${CSS.escape(id)}"]`); if (n) { const r = n.getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) n.scrollIntoView({block: 'center'}); } }
}
S.querySelectorAll('.node').forEach(n => {
  n.onclick = () => pick(n.dataset.kind, sel && sel.id === n.dataset.id ? null : n.dataset.id);
  n.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); n.onclick(); } };
  n.onmouseenter = () => { if (!sel) highlight(n.dataset.kind, n.dataset.id); };
  n.onmouseleave = () => { if (!sel) highlight(null, null); };
});
$('reset').onclick = () => { $('q').value = ''; S.querySelectorAll('.hit').forEach(x => x.classList.remove('hit')); pick(null, null); };
$('q').oninput = () => {
  const q = $('q').value.trim();
  S.querySelectorAll('.node').forEach(n => {
    const name = n.dataset.kind === 'd' ? docs.get(n.dataset.id).title + docs.get(n.dataset.id).file : items.get(n.dataset.id).title + items.get(n.dataset.id).unit;
    n.classList.toggle('hit', !!q && name.includes(q));
  });
  const first = q && S.querySelector('.node.hit'); if (first) first.scrollIntoView({block: 'center', inline: 'nearest'});
};
panel();
})();
</script>
</body>
</html>
